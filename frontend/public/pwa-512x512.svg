<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Ring / Lifebuoy Accent -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-dasharray="80 30" />
  
  <!-- Inner Shield -->
  <path d="M256 120 L370 170 C370 280 256 360 256 385 C256 360 142 280 142 170 Z" fill="#ffffff" fill-opacity="0.08" stroke="#3b82f6" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Emergency Cross / Distress Beacon -->
  <rect x="236" y="190" width="40" height="132" rx="10" fill="url(#redGrad)" />
  <rect x="190" y="236" width="132" height="40" rx="10" fill="url(#redGrad)" />
  
  <!-- Radar Wave Accents -->
  <path d="M190 140 A 100 100 0 0 1 322 140" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round" />
  <path d="M160 110 A 140 140 0 0 1 352 110" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" />
</svg>
